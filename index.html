  <style>
    /* Solo el logo y Coming soon (como veexapp.com): no se muestra nada del producto todavía */
    :root { --papel: #ffffff; --tinta: #20211e; --suave: #75766e; --azul: #1f8fdc; color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--papel); color: var(--tinta); font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
    /* Todo va sobre la hoja de puntos (Vic, 5 nov 2026): cada cosa ocupa filas enteras de 22 px y su línea de letra
       cae justo en una fila de puntos (los puntos están a 11 px de cada fila). Los "top" de abajo corrigen lo que mide cada letra. */
    main { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 176px 16px 44px; }
    .logo { height: 132px; width: auto; max-width: calc(100vw - 32px); color: var(--tinta); position: relative; top: var(--ajuste-logo, 0px); }
    :root { --ajuste-logo: -7.7px; --ajuste-lema: -5px; --ajuste-soon: 11px; --ajuste-links: -5px; --ajuste-pie: -4px; }
    @media (max-width: 520px) { main { padding-top: 132px; } .logo { height: 88px; } :root { --ajuste-logo: 5.9px; } }
    .logo .logo-ex { fill: color-mix(in srgb, currentColor 93%, #1f8fdc); }   /* la ex teñida por el resaltador */
    .soon { margin-top: 44px; display: inline-flex; align-items: flex-start; gap: 10px; font-size: 12px; line-height: 22px; height: 26px; margin-bottom: 18px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; padding: 0 2px; border-bottom: 3px solid #38a8f5; position: relative; top: var(--ajuste-soon, 0px); }   /* sin recuadro, con subrayado azul (Vic, 5 nov 2026) */
    /* Libro a marcador pasando una hoja, en vez del punto azul (Vic, 30 oct 2026): trazo de plumón como los íconos de la app */
    .libro { width: 24px; height: 18px; flex: none; overflow: visible; }
    /* la hoja se mueve con la animación SVG de adentro (se dobla como papel, Vic 30 oct 2026) */
    @media (prefers-reduced-motion: reduce) { .libro .pasa { display: none; } }
    .lema { margin-top: 22px; font-size: 15px; line-height: 22px; color: var(--suave); letter-spacing: .3px; position: relative; top: var(--ajuste-lema, 0px); }
    .links { margin-top: 44px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; position: relative; top: var(--ajuste-links, 0px); }
    .links a { display: inline-block; color: var(--tinta); text-decoration: none; font-weight: 600; font-size: 14px; line-height: 22px; padding: 0 4px; }   /* sin recuadro ni logo de Instagram, solo el texto (Vic, 5 nov 2026) */
    .links a span { color: var(--suave); font-weight: 500; }
    .links a:hover { color: var(--azul); }
    footer { text-align: center; color: var(--suave); font-size: 12px; line-height: 22px; padding: 22px 16px 44px; position: relative; top: var(--ajuste-pie, 0px); }
    body { background-image: radial-gradient(#c9c8c3 1.2px, transparent 1.4px); background-size: 22px 22px; }  /* hoja de puntos grises (Vic, 5 nov 2026: primero azules, luego eligió grises) */
    /* Opción C, como libro abierto (Vic, 7 nov 2026): el logo a la izquierda, una línea negra de lomo y la frase con Coming soon a la derecha.
       Cuadrada (Vic, 7 nov 2026): el grupo entero va al centro de la pantalla; del logo a la línea y de la línea a la frase hay
       la misma distancia; la línea mide lo mismo que la frase con Coming soon e Instagram; Coming soon e Instagram centrados bajo la frase.
       En el teléfono va uno debajo del otro y la línea pasa a ser horizontal. */
    :root { --lomo: clamp(40px, 5.5vw, 110px); --alto-logo: clamp(90px, 12vw, 190px); }
    main { flex: 1; display: flex; flex-direction: row; justify-content: center; align-items: center; padding: 44px 16px; }
    .izq { display: flex; align-items: center; padding-right: calc(var(--lomo) - var(--alto-logo) * .049); }   /* el dibujo del logo termina un poco antes de su caja */
    .logo { height: var(--alto-logo); top: 0; }
    .der { display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center; border-left: 3px solid var(--tinta); padding: 6px 0 6px calc(var(--lomo) - 3px); }
    .der h1 { font-family: 'Crimson Pro', Georgia, serif; font-weight: 400; font-size: clamp(34px, 3.8vw, 60px); line-height: 1.05; letter-spacing: -.5px; align-self: stretch; }
    .der h1 i { color: var(--azul); }
    .soon { margin: 0; font-size: 14px; height: 32px; line-height: 28px; letter-spacing: 3.5px; top: 0; }
    .libro { width: 30px; height: 24px; }
    .links { margin: -8px 0 0; top: 0; justify-content: center; }
    .links a { font-size: 16px; padding: 0; }
    footer { top: 0; padding-bottom: 28px; }
    @media (max-width: 760px) {
      main { flex-direction: column; gap: 36px; padding-top: 32px; }
      .izq { padding: 0 0 32px; border-bottom: 3px solid var(--tinta); align-self: stretch; justify-content: center; }
      .logo { height: 84px; }
      .der { border-left: 0; padding: 0; gap: 26px; text-align: center; }
      .der h1 { font-size: 36px; }
    }
  </style>
