    /* Solo el logo y Coming soon (como veexapp.com): no se muestra nada del producto todavía */
    :root { --papel: #f6f3ec; --tinta: #20211e; --suave: #75766e; --azul: #1f8fdc; color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--papel); color: var(--tinta); font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px 16px 40px; }
    .logo { width: min(78vw, 460px); height: auto; color: var(--tinta); }
    .soon { margin-top: 44px; display: inline-flex; align-items: center; gap: 10px; border: 1.5px solid var(--tinta); font-size: 12px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; padding: 9px 18px; }
    .soon::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--azul); animation: tinta 1.6s ease-in-out infinite; }
    @keyframes tinta { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .soon::before { animation: none; } }
    .lema { margin-top: 18px; font-size: 15px; color: var(--suave); letter-spacing: .3px; }
    .links { margin-top: 36px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .links a { display: inline-flex; align-items: center; gap: 8px; color: var(--tinta); text-decoration: none; font-weight: 600; font-size: 14px; border: 1.5px solid var(--tinta); padding: 11px 20px; }
    .links a:hover { background: var(--tinta); color: var(--papel); }
    .links svg { width: 18px; height: 18px; fill: currentColor; }
    footer { text-align: center; color: var(--suave); font-size: 12px; padding: 24px 16px 32px; }
